[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-munk-studies"
version = "0.1.0"
description = "Studies and investigations for viva-munk (pymunk 2D multi-cell physics). The simulator is the viva-munk package, pinned per study for reproducibility; onboarded to the vivarium-workbench."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  {name = "Eran Agmon", email = "agmon.eran@gmail.com"},
  {name = "Ryan Spangler"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # The simulator, pinned by git tag for reproducibility (every study.yaml also
    # records the pin under `simulator:`). Provides the viva_munk package, so
    # study `composite:` dotted paths (viva_munk.composites.*) resolve.
    "viva-munk",
    # Workbench + discovery-engine: read-only dashboards + run-earned grading
    # (this workspace is onboarded to the vivarium-workbench).
    "vivarium-workbench",
    "viva-discovery-engine",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-munk-studies"
Issues = "https://github.com/vivarium-collective/viva-munk-studies/issues"

# Metadata-only wheel: this repo is the investigation workspace and ships no
# importable package of its own (the simulator package viva_munk lives in viva-munk).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
viva-munk = { git = "https://github.com/vivarium-collective/viva-munk.git", tag = "0.1.0" }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
viva-discovery-engine = { git = "https://github.com/vivarium-collective/discovery-engine.git", branch = "main" }

[tool.uv]
# vivarium-workbench caps viva-discovery-engine by semver policy; resolve DE from
# git main so this workspace tracks the current engine (matches the other viva
# workspaces).
override-dependencies = [
    "viva-discovery-engine @ git+https://github.com/vivarium-collective/discovery-engine.git@main",
]
